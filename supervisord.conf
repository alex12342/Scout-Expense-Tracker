; ===========================================================================
; Trailhead Ledger — supervisord process table
; Boot order (by priority): postgres -> db-init -> api -> nginx
; ===========================================================================

[supervisord]
nodaemon=true
user=root
logfile=/app/data/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/run/supervisord.pid
childlogdir=/app/data

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- PostgreSQL (embedded) -------------------------------------------------
; Runs as the `postgres` system user; data lives on the persistent volume.
[program:postgres]
command=/bin/bash -c 'exec /usr/lib/postgresql/*/bin/postgres -D /app/data/postgres'
user=postgres
directory=/app
environment=PGDATA="/app/data/postgres"
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/app/data/postgres.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; --- One-shot database bootstrap ------------------------------------------
; Waits for Postgres, creates the DB, runs drizzle push, seeds the admin,
; then writes /app/data/.db-ready which the API waits on.
[program:db-init]
command=/app/db-init.sh
user=root
directory=/app
priority=20
autostart=true
autorestart=false
startsecs=1
startretries=3
redirect_stderr=true
stdout_logfile=/app/data/db-init.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; --- Express API -----------------------------------------------------------
[program:api]
command=/app/api-start.sh
user=root
directory=/app
environment=NODE_ENV="production",PORT="8080"
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=10
redirect_stderr=true
stdout_logfile=/app/data/api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; --- Nginx (static + /api proxy) ------------------------------------------
[program:nginx]
command=nginx -g "daemon off;"
user=root
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=1
redirect_stderr=true
stdout_logfile=/app/data/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
